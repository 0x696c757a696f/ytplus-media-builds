name: Download FFmpeg
run-name: "Download FFmpeg ${{ inputs.ffmpeg_tag }}${{ inputs.release && ' (release)' || '' }}"

# The ffmpeg.exe and ffprobe.exe YTPlus downloads for yt-dlp to merge and
# repackage downloads. Built apart from the FFmpeg inside libmpv, which
# playback needs in full: see download-ffmpeg/build.sh.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_tag:
        description: "FFmpeg release tag"
        required: true
        default: "n8.1.3"
      zlib_tag:
        description: "zlib release tag"
        required: true
        default: "v1.3.1"
      release:
        description: "Publish a release"
        type: boolean
        default: false
  pull_request:
    paths:
      - "download-ffmpeg/**"
      - ".github/workflows/download-ffmpeg.yml"

permissions:
  contents: read

env:
  FFMPEG_TAG: ${{ inputs.ffmpeg_tag || 'n8.1.3' }}
  ZLIB_TAG: ${{ inputs.zlib_tag || 'v1.3.1' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86_64-v3, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Install llvm-mingw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nasm zip > /dev/null
          # The newest llvm-mingw, checked against the digest GitHub records
          # for the release asset.
          release=$(gh api repos/mstorsjo/llvm-mingw/releases/latest)
          tag=$(jq -r .tag_name <<<"$release")
          asset=$(jq -c '[.assets[] | select(.name | test("^llvm-mingw-.*-ucrt-ubuntu-[0-9.]+-x86_64\\.tar\\.xz$"))] | sort_by(.name) | last' <<<"$release")
          name=$(jq -r .name <<<"$asset")
          digest=$(jq -r .digest <<<"$asset")
          [[ $digest == sha256:* ]] || { echo "no digest for $name"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/$name" "$(jq -r .browser_download_url <<<"$asset")"
          echo "${digest#sha256:}  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW=$tag" >> "$GITHUB_ENV"

      - name: Fetch sources
        run: |
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffmpeg"
          git -c advice.detachedHead=false clone -q --depth 1 --branch "$ZLIB_TAG" https://github.com/madler/zlib.git "$RUNNER_TEMP/zlib"

      - name: Build
        run: |
          ./download-ffmpeg/build.sh "${{ matrix.arch }}" "$RUNNER_TEMP/ffmpeg" "$RUNNER_TEMP/zlib" "$RUNNER_TEMP/out"
          echo "Toolchain: llvm-mingw $LLVM_MINGW" >> "$RUNNER_TEMP/out/BUILD.txt"
          name="ffmpeg-download-${{ matrix.arch }}-$FFMPEG_TAG"
          (cd "$RUNNER_TEMP/out" && zip -q -9 "$GITHUB_WORKSPACE/$name.zip" *)
          ls -l "$name.zip"
          echo "### ${{ matrix.arch }}: $(du -h "$name.zip" | cut -f1) zipped" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-download-${{ matrix.arch }}
          path: ffmpeg-download-${{ matrix.arch }}-*.zip
          if-no-files-found: error

  samples:
    name: Make test media
    runs-on: ubuntu-latest
    steps:
      - name: Encode short clips like YouTube's streams
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir samples && cd samples
          f="ffmpeg -hide_banner -loglevel error -y"
          $f -f lavfi -i testsrc2=s=640x360:r=30 -t 3 -c:v libx264 -an v_h264.mp4
          $f -f lavfi -i testsrc2=s=640x360:r=30 -t 3 -c:v libvpx-vp9 -an v_vp9.webm
          $f -f lavfi -i testsrc2=s=320x180:r=30 -t 2 -c:v libaom-av1 -cpu-used 8 -an v_av1.mp4
          $f -f lavfi -i testsrc2=s=640x360:r=30 -t 3 -c:v libx265 -an v_hevc.mp4
          $f -f lavfi -i sine=d=3 -c:a aac a.m4a
          $f -f lavfi -i sine=d=3 -c:a libopus a.webm
          $f -f lavfi -i testsrc2=s=640x360:r=30 -f lavfi -i sine -t 4 -c:v libx264 -c:a aac -f hls -hls_time 1 -hls_playlist_type vod hls.m3u8
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples

  check:
    name: Check ${{ matrix.arch }} on Windows
    needs: [build, samples]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: x86_64-v3
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-download-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: samples
          path: samples
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Merge as yt-dlp does
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path (Get-Item ffmpeg-download-*.zip).FullName -DestinationPath ffmpeg
          python -m pip install -q yt-dlp
          ./ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          # HTTPS goes through Windows' own TLS (SChannel).
          $probe = ./ffmpeg/ffprobe.exe -v error -i https://github.com/0x696c757a696f/ytplus-media-builds 2>&1 | Out-String
          if ($probe -match 'Protocol not found|not supported|TLS') { throw "HTTPS failed: $probe" }
          Push-Location samples
          python -I ../download-ffmpeg/check_merge.py ../ffmpeg
          if ($LASTEXITCODE -ne 0) { throw 'merge check failed' }
          Pop-Location

  release:
    name: Publish
    needs: check
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-download-*
          merge-multiple: true
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ffmpeg-download-*.zip > sha256.txt
          cat sha256.txt
          tag="ffmpeg-$FFMPEG_TAG-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Download FFmpeg $FFMPEG_TAG" \
            --notes "ffmpeg.exe and ffprobe.exe for YTPlus downloads (LGPL, built by download-ffmpeg/build.sh). Each ZIP's BUILD.txt names the exact sources and configuration." \
            ffmpeg-download-*.zip sha256.txt
